name = "flashstone"
# Must stay within what the installed Workers runtime supports (wrangler 3.x → 2025-07-18).
compatibility_date = "2025-07-18"
# SvelteKit's server bundle imports node:async_hooks; without this the Worker won't boot.
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Accounts, collections, decks and gold. Reached as `platform.env.DB` from
# SvelteKit server routes — NOT from a `functions/` directory, which Pages
# ignores whenever a `_worker.js` exists, and adapter-cloudflare always emits one.
[[d1_databases]]
binding = "DB"
database_name = "flashstone-db"
database_id = "2d848ca6-c435-47f5-be5a-552037001bfe"
